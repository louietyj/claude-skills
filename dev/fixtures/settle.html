<html><head><style>
.spinner { width: 24px; height: 24px; border: 4px solid #ccc; border-top-color: #333;
  border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style></head><body>
<button id="load">load</button> <button id="churn">churn</button>
<div id="out">idle</div>
<script>
var out = document.getElementById('out');
document.getElementById('load').onclick = function () {
  out.innerHTML = '<div class="spinner"></div>';
  setTimeout(function () { out.textContent = 'Loaded 42'; }, 1000);
};
document.getElementById('churn').onclick = function () {
  var n = 0;
  setInterval(function () { out.textContent = 'tick ' + n++; }, 100);
};
</script></body></html>
