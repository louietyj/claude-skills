<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fake handset</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;background:#111;color:#eee;font-family:system-ui,sans-serif;
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
h1{font-size:18px;font-weight:600;color:#999}
#who{font-size:28px}
#state{color:#9a9}
.row{display:flex;gap:12px}
button{font:inherit;font-size:18px;padding:12px 22px;border-radius:24px;border:1px solid #444;background:#222;color:#eee}
#answer{background:#1d5a2a} #hangup,#decline{background:#6a1f1f}
.hide{display:none}
</style>
</head><body>
<h1>Fake handset (dev/fake_telnyx.py)</h1>
<div id="who">No call</div>
<div id="state"></div>
<div class="row">
  <button id="answer" class="hide">Answer</button>
  <button id="decline" class="hide">Decline</button>
  <button id="hangup" class="hide">Hang up</button>
  <button id="drop" class="hide" title="as if the signal were lost">Drop</button>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let call = null, line = null;

async function act(action) {
  if (call) await fetch(`/fake/${action}/${encodeURIComponent(call.id)}`, { method: "POST" });
  poll();
}

// G.711 mu-law, as a phone line carries it.
function mulaw(sample) {
  let s = Math.max(-1, Math.min(1, sample)) * 32635;
  const sign = s < 0 ? 0x80 : 0;
  s = Math.min(Math.abs(s), 32635) + 132;
  let exp = 7;
  for (let mask = 0x4000; (s & mask) === 0 && exp > 0; mask >>= 1) exp--;
  return ~(sign | (exp << 4) | ((s >> (exp + 3)) & 0x0f)) & 0xff;
}

// The mic, at 8 kHz, in 20 ms frames: what Telnyx would stream from the call.
async function openLine(id) {
  const ws = new WebSocket(`${location.origin.replace(/^http/, "ws")}/fake/handset/${encodeURIComponent(id)}`);
  ws.binaryType = "arraybuffer";
  const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true } });
  const ctx = new AudioContext({ sampleRate: 8000 });
  const node = ctx.createScriptProcessor(256, 1, 1);
  let pending = [];
  node.onaudioprocess = (e) => {
    for (const v of e.inputBuffer.getChannelData(0)) pending.push(mulaw(v));
    while (pending.length >= 160 && ws.readyState === 1) {
      ws.send(new Uint8Array(pending.slice(0, 160)));
      pending = pending.slice(160);
    }
  };
  ctx.createMediaStreamSource(mic).connect(node);
  node.connect(ctx.destination);
  line = { ws, mic, ctx };
}

function closeLine() {
  if (!line) return;
  try { line.ws.close(); } catch {}
  line.mic.getTracks().forEach((t) => t.stop());
  line.ctx.close();
  line = null;
}

$("answer").onclick = async () => { const id = call?.id; await act("answer"); if (id) openLine(id); };
$("decline").onclick = () => act("hangup");
$("hangup").onclick = () => act("hangup");
$("drop").onclick = () => act("drop");

async function poll() {
  try { call = (await (await fetch("/fake/calls", { cache: "no-store" })).json()).at(-1) || null; } catch {}
  $("who").textContent = call ? call.to : "No call";
  $("state").textContent = call ? (call.state === "ringing" ? "Ringing…" : "On the call") : "";
  const ringing = call?.state === "ringing", up = call?.state === "up";
  if (!up) closeLine();
  $("answer").classList.toggle("hide", !ringing);
  $("decline").classList.toggle("hide", !ringing);
  $("hangup").classList.toggle("hide", !up);
  $("drop").classList.toggle("hide", !up);
}
setInterval(poll, 500);
poll();
</script>
</body></html>
