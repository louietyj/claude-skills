<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path transform='scale(2.2)' fill='%23d97757' d='m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z'/><circle cx='50' cy='50' r='13' fill='%231a1a1a'/><rect x='46.5' y='40.5' width='7' height='12' rx='3.5' fill='%23fff'/><path d='M43.5 48.5a6.5 6.5 0 0 0 13 0M50 55v3.5' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>">
<style>
/* One layout for watch and phone: the stage fills the screen (on a round
   watch, exactly the face), and the middle sits near the centre, where a
   circle is widest. Sizes are in vmin; Samsung Internet on a Pixel Watch 3
   lays out 456 CSS px at a pixel ratio of 1, though screen.width says 228. */
:root{--fg:#e8e8e8;--clock:#b4b4b4;--dim:#8a8a8a;--amber:#e0a030;--red:#e05040}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
#stage{position:relative;width:100vw;height:100vh;height:100dvh}
button,input{font:inherit;color:var(--fg);background:#161616;border:0.6vmin solid #3a3a3a;cursor:pointer}
button:active{background:#2a2a2a}
.hide{display:none!important}
/* A circle narrows toward the top: the ~48vmin-wide clock clears the edge
   only below ~8%. */
#top{position:absolute;top:9%;left:0;right:0;display:flex;flex-direction:column;align-items:center}
#clock{color:var(--clock);font-size:20vmin;line-height:1;font-variant-numeric:tabular-nums}
#sidrow{display:flex;align-items:center;gap:2.5vmin}
#sid{color:var(--dim);font-size:6vmin;letter-spacing:.15em}
/* Centred between the clock and stop, not on the face, so a tall block
   never rides up into the clock. */
#mid{position:absolute;top:56%;left:10%;right:10%;transform:translateY(-50%)}
/* In a room the audio line sits under the id, so the notes start lower. */
#stage.inroom #mid{top:62%}
#pair,#idle,#live{display:flex;flex-direction:column;align-items:center;gap:4vmin}
/* Three buttons clear a round face's edge only this close together. */
#bot{position:absolute;bottom:6%;left:0;right:0;display:flex;justify-content:center;gap:4vmin}
#debug{position:absolute;bottom:0;left:0;right:0;font-size:12px;color:#5f5;white-space:pre-line}
#msg{color:var(--dim);font-size:8vmin}
#status{font-size:7vmin;font-weight:600}
#choices{display:flex;gap:3vmin;margin-top:2vmin}
#choices .pill{font-size:5.5vmin;padding:1.2vmin 5vmin}
#where{color:var(--dim);font-size:5.5vmin;margin-top:2vmin;font-variant-numeric:tabular-nums}
#status.amber{color:var(--amber)} #status.red{color:var(--red)}
#note{color:#fff;font-weight:700;font-size:6.5vmin;line-height:1.2}
/* Between the session id and the bottom row; what doesn't fit scrolls (the crown on the watch). */
#live{max-height:28vh;max-height:28dvh;overflow-y:auto;width:100%;scrollbar-width:none}
#live::-webkit-scrollbar{display:none}
#note.flash{animation:flash .5s ease-in-out 6 alternate}
#note.old{color:var(--dim);font-weight:600}
@keyframes flash{from{opacity:1}to{opacity:.35}}
.big{width:44vmin;height:44vmin;border-radius:50%;display:flex;flex-direction:column;
     align-items:center;justify-content:center;font-size:7vmin}
.big b{font-size:10vmin;letter-spacing:.04em}
.big small{font-size:5vmin;color:var(--amber);letter-spacing:.15em}
#stop,#pause,#mute{width:17vmin;height:17vmin;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
#bot svg{width:7vmin;height:7vmin;fill:var(--clock)}
#stop{border-color:#4a2a2a}
#mute path{fill:none;stroke:var(--clock);stroke-width:1;stroke-linecap:round}
#mute:not(.on) .slash{display:none}
#mute.on{border-color:var(--amber)}
#mute.on rect{fill:var(--amber)} #mute.on path{stroke:var(--amber)}
#menu{width:8vmin;height:8vmin;border-width:0.4vmin}
#menu svg{width:4vmin;height:4vmin;fill:var(--dim)}
/* Over the whole stage, and inside the middle of a round face. */
#sheet{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:flex;flex-direction:column;align-items:center;
       justify-content:center;justify-content:safe center;gap:4vmin;z-index:1;overflow-y:auto;padding:14vmin 0}
#phonenum{width:62vmin;font-size:6vmin;text-align:center;border-radius:3vmin;padding:1.5vmin}
#numrow button{font-size:4.5vmin;border:0;background:none;color:var(--fg);text-decoration:underline;padding:0 1vmin}
#holdrow{display:flex;flex-direction:column;align-items:center;gap:2vmin}
.label{font-size:7vmin}
.hint{color:var(--dim);font-size:4.5vmin;max-width:60vmin}
.stepper{display:flex;align-items:center;gap:5vmin}
.stepper button{width:15vmin;height:15vmin;border-radius:50%;padding:0;font-size:9vmin;line-height:1}
#holdval{font-size:11vmin;min-width:20vmin;font-variant-numeric:tabular-nums}
.pill{border-radius:8vmin;padding:2vmin 6vmin;font-size:6vmin}
#list{display:flex;flex-direction:column;align-items:center;gap:2vmin;max-height:40vmin;overflow-y:auto;width:100%}
.row{width:70vmin;border-radius:4vmin;padding:1.5vmin;font-size:9vmin}
.row small{display:block;color:var(--dim);font-size:5vmin}
#pairmsg{color:var(--dim);font-size:7vmin}
#code{width:62vmin;font-size:11vmin;text-align:center;letter-spacing:.2em;border-radius:3vmin;padding:1vmin}
#pairbtn{border-radius:4vmin;padding:1vmin 6vmin;font-size:8vmin}
</style>
</head><body>
<div id="stage">
<div id="top">
  <div id="clock"></div>
  <div id="sidrow">
    <span id="sid"></span>
    <button id="menu" class="hide" aria-label="settings"><svg viewBox="0 0 10 10"><circle cx="1.5" cy="5" r="1.1"/><circle cx="5" cy="5" r="1.1"/><circle cx="8.5" cy="5" r="1.1"/></svg></button>
  </div>
  <!-- Where the room's audio is, or the two ways to give it some. -->
  <div id="choices" class="hide">
    <button id="usehere" class="pill">Web</button>
    <button id="callme" class="pill">Phone</button>
  </div>
  <div id="where" class="hide"></div>
</div>
<div id="mid">
  <div id="pair" class="hide">
    <div id="pairmsg">Pairing code</div>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="······">
    <button id="pairbtn">Pair</button>
  </div>
  <div id="idle" class="hide">
    <div id="msg">Waiting for Claude…</div>
    <div id="list"></div>
  </div>
  <div id="live" class="hide">
    <div id="status" class="hide"></div>
    <div id="note"></div>
  </div>
</div>
<div id="bot">
  <button id="mute" class="hide" aria-label="mute"><svg viewBox="0 0 10 10"><rect x="3.5" y="0.5" width="3" height="5.5" rx="1.5"/><path d="M2 4.5a3 3 0 0 0 6 0M5 7.5v2"/><path class="slash" d="M1.5 1l7 8.5"/></svg></button>
  <button id="pause" class="hide" aria-label="leave audio"><svg viewBox="0 0 10 10"><rect x="1.5" y="1" width="2.5" height="8"/><rect x="6" y="1" width="2.5" height="8"/></svg></button>
  <button id="stop" class="hide" aria-label="stop"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8"/></svg></button>
</div>
<div id="sheet" class="hide">
  <div id="holdrow" class="hide">
    <div class="label">Turn wait</div>
    <div class="stepper">
      <button id="holddown" aria-label="shorter">−</button>
      <span id="holdval"></span>
      <button id="holdup" aria-label="longer">+</button>
    </div>
    <div class="hint">silence before your turn goes to Claude</div>
  </div>
  <button id="callme2" class="pill hide">Switch to phone</button>
  <button id="hangup" class="pill hide">Hang up the phone</button>
  <button id="usehere2" class="pill hide">Switch to web here</button>
  <button id="pip" class="pill hide">Picture in picture</button>
  <div id="numrow" class="hint"></div>
  <input id="phonenum" class="hide" type="tel" autocomplete="tel" placeholder="+1 415 555 0123">
  <button id="savenum" class="pill hide">Save number</button>
  <button id="done" class="pill">Done</button>
</div>
<div id="debug" class="hide"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KEY = "intercom-k";   // changing it unpairs every device
// Only reported to Claude; both devices show the same page.
const UI = new URLSearchParams(location.search).get("ui")
  || (Math.min(innerWidth, innerHeight, screen.width, screen.height) <= 320 ? "watch" : "phone");

// This browser's id in a room: its newest page replaces any older socket of its
// own the relay still holds (a back swipe or reload doesn't always close one).
const DEV = (() => {
  try {
    let d = localStorage.getItem("intercom-dev");
    if (!d) { d = Math.random().toString(36).slice(2, 12); localStorage.setItem("intercom-dev", d); }
    return d;
  } catch { return Math.random().toString(36).slice(2, 12); }
})();

// The device token: from a #k= link (stored, then stripped), else storage, else pairing.
function store(k) { try { k ? localStorage.setItem(KEY, k) : localStorage.removeItem(KEY); } catch {} }
let K = new URLSearchParams(location.hash.slice(1)).get("k") || "";
if (K) { store(K); history.replaceState(null, "", location.pathname + location.search); }
else { try { K = localStorage.getItem(KEY) || ""; } catch {} }

// The watch's browser has no picture-in-picture, so no button there.
const PIP_OK = !!document.pictureInPictureEnabled;

const MIME = ["audio/webm;codecs=opus", "audio/webm"].find(
  (t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";

// Talk mode's echo cancellation: the browser's in real Chrome (AEC3, or the
// phone's own on Android), AEC3 in the page everywhere else (README).
const OWN_AEC = (new URLSearchParams(location.search).get("aec")
  || (navigator.userAgentData?.brands?.some((b) => b.brand === "Google Chrome") ? "off" : "on")) === "on";

let mode = "idle", sid = null, session = null, ws = null, stream = null, rec = null, lock = null;
let sendStream = null, muted = false, raw = null, aec = null;
// The room can have many screens; at most one holds the audio. `roomAudio` is
// which ("watch", "phone"), null for none, undefined until the relay says.
let holding = false, roomAudio, roomCall = null, roomSince = null;
let talk = false, voice = null, voiceEl = null, claudeTalking = false;
let meterCtx = null, meterTimer = null, probe = null, chirp = null;
let backoff = 250, retryTimer = null, failures = 0, noteTimer = null;
// The recorder runs through a dropped socket. Its recent chunks are kept, so a
// new socket can resend whatever the relay didn't get (README: "A dropped page").
const KEEP_CHUNKS = 60;          // 15 s at 250 ms, the relay's grace
const SOCKET_SILENT_MS = 6000;   // the relay pings every 2 s
let recId = null, recN = 0, recKept = [], streaming = false, lastRx = 0;
let netType = navigator.connection?.type ?? null, voiceRetries = 0;

function tick() {
  const d = new Date();
  $("clock").textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")}`;
}
tick(); setInterval(tick, 1000);

function show(screen) {
  for (const s of ["pair", "idle", "live"]) $(s).classList.toggle("hide", s !== screen);
  $("stop").classList.toggle("hide", screen !== "live");
  $("menu").classList.toggle("hide", screen !== "live");
  if (screen !== "live") { $("sid").textContent = ""; closeSheet(); }
  renderRoom();
}

// What this screen offers depends on where the room's audio is. The choice
// pops up only when nothing has it; moving it from elsewhere is in the sheet.
function renderRoom() {
  const inRoom = mode === "live";
  $("stage").classList.toggle("inroom", inRoom);
  $("pause").classList.toggle("hide", !inRoom || !holding);
  $("mute").classList.toggle("hide", !inRoom || !holding);
  const ringing = roomCall && roomCall.state !== "up";
  const text = ringing ? "Calling your phone…"
    : roomAudio === "line" ? `Phone · ${elapsed(roomSince)}`
    : holding ? `Web · here · ${elapsed(roomSince)}`
    : roomAudio ? `Web · other device · ${elapsed(roomSince)}` : "";
  $("choices").classList.toggle("hide", !inRoom || roomAudio !== null || !!roomCall || holding);
  $("where").classList.toggle("hide", !inRoom || !text);
  $("where").textContent = text;
  if ($("note").textContent) fitNote($("note"));
}

// `since` is in this page's clock (see the room message); null before the relay says.
function elapsed(since) {
  if (since == null) return "0:00";
  const s = Math.max(0, Math.floor((Date.now() - since) / 1000));
  const two = (n) => String(n).padStart(2, "0");
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}:${two(m)}:${two(s % 60)}` : `${m}:${two(s % 60)}`;
}
// Only trouble and pauses: an empty status leaves the room to the steer note.
function status(text, cls) {
  $("status").textContent = text || "";
  $("status").className = (cls || "") + (text ? "" : " hide");
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ---- pairing --------------------------------------------------------------------

function needPairing(why) {
  K = ""; store("");
  mode = "pair";
  $("pairmsg").innerHTML = why || "Pairing code";
  show("pair");
}

// The sixth digit submits: no extra tap on a watch.
$("code").addEventListener("input", () => {
  if ($("code").value.replace(/\D/g, "").length === 6) $("pairbtn").click();
});

$("pairbtn").onclick = async () => {
  const code = $("code").value.replace(/\D/g, "");
  if (code.length !== 6) { $("pairmsg").textContent = "Enter 6 digits"; return; }
  try {
    const r = await fetch("/pair/claim", { method: "POST", body: JSON.stringify({ code }) });
    const out = await r.json();
    if (!out.ok) { $("pairmsg").textContent = capital(out.error || "wrong code"); return; }
    K = out.k; store(K);
    $("code").value = "";
    mode = "idle"; show("idle"); poll();
  } catch { $("pairmsg").textContent = "Offline…"; }
};

function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ---- idle: find what Claude armed --------------------------------------------------

async function poll() {
  if (mode !== "idle") return;
  try {
    const r = await fetch(`/armed?k=${encodeURIComponent(K)}`, { cache: "no-store" });
    if (r.status === 401) return needPairing("Not paired.<br>Pairing code");
    render((await r.json()).sessions || []);
  } catch { $("msg").textContent = "Offline…"; }
}

function render(sessions) {
  const list = $("list");
  list.innerHTML = "";
  $("msg").classList.toggle("hide", sessions.length > 0);
  if (sessions.length === 0) $("msg").textContent = "Waiting for Claude…";
  if (sessions.length === 1) {
    const s = sessions[0];
    const b = document.createElement("button");
    b.className = "big";
    // The mode is Louie's consent: only a TALK session can speak through this device.
    b.innerHTML = `${s.state === "live" ? "Rejoin" : "Join"}<b>${s.id}</b><small>${s.mode === "talk" ? "TALK" : "LISTEN"}</small>`;
    b.onclick = () => join(s);
    list.appendChild(b);
    return;
  }
  for (const s of sessions) {
    const b = document.createElement("button");
    b.className = "row";
    b.innerHTML = `${s.state === "live" ? "● " : ""}${s.id} · ${s.mode === "talk" ? "TALK" : "LISTEN"}<small></small>`;
    b.querySelector("small").textContent = s.label || "";
    b.onclick = () => join(s);
    list.appendChild(b);
  }
}

setInterval(poll, 3000);

// ---- live -------------------------------------------------------------------------

async function wake() {
  try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request("screen");
        lock.addEventListener("release", () => { lock = null; }); } } catch {}
}

// Joining makes this page a screen in the room, with no audio.
async function join(s) {
  talk = s.mode === "talk";
  session = s; sid = s.id; mode = "live"; failures = 0;
  holding = false; roomAudio = undefined; roomCall = null; roomSince = null; holdMs = null; muted = false;
  clearTimeout(noteTimer); $("note").textContent = "";
  show("live");
  $("sid").textContent = `${s.id} · ${talk ? "TALK" : "LISTEN"}`;
  await wake();
  connect();
}

// Called from a tap: mobile browsers only let a tap start audio output.
async function takeAudio() {
  closeSheet();
  if (!MIME) return status("This browser can't record audio", "red");
  // Before the first await, to claim the tap's permission to play.
  if (talk && !voiceEl) {
    voiceEl = new Audio();
    voiceEl.autoplay = true;
    voiceEl.play().catch(() => {});
  }
  try {
    // Listen: processing off, it flattens the voice differences diarization
    // relies on. Talk: echo cancellation on, or Claude transcribes its own voice.
    // Auto gain stays off in both: in talk mode it would boost echo residue to speaking level.
    stream = await navigator.mediaDevices.getUserMedia({ audio: talk
      ? { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
      : { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch { return status("Microphone blocked", "red"); }
  // Mute disables only this clone: the transcriber gets silence on the same
  // stream, and the probe still reads the real mic, so Claude isn't told it died.
  sendStream = new MediaStream([stream.getAudioTracks()[0].clone()]);
  muted = false;
  // Only after the mic, which puts Android in call mode: a context opened earlier
  // gets a media stream, Chrome plays Claude's voice through it, and the phone's
  // echo canceller ignores media streams. AEC3 runs at 48 kHz.
  try { meterCtx = new AudioContext(talk && OWN_AEC ? { sampleRate: 48000 } : {}); meterCtx.resume(); } catch {}
  if (talk && OWN_AEC && meterCtx) await startAec();
  applyMute();
  holding = true;
  renderRoom();
  if (talk) startMeter();
  startProbe();
  startChirps();
  stream.getAudioTracks()[0].addEventListener("ended", () => status("Microphone lost", "red"));
  send({ type: "take" });
  startAudio();
}

// On a socket the relay knows holds the audio: a fresh segment, and Claude's voice.
function startAudio() {
  reportVis();
  segment();
  if (talk) startVoice();
}

function deviceUrl() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${location.host}/device?k=${encodeURIComponent(K)}&id=${sid}`;
}

function connect() {
  clearTimeout(retryTimer);
  if (mode !== "live") return;
  status("Connecting…", "amber");
  const sock = new WebSocket(deviceUrl());
  ws = sock;
  streaming = false;
  sock.onopen = () => {
    backoff = 250; failures = 0;
    lastRx = Date.now();
    status("");
    // A screen that held the mic before the drop takes it back, if nothing else has.
    // With its recorder still running, the relay answers `resume`.
    send({ type: "hello", ui: UI, dev: DEV, holding, ...(holding && rec ? { rec: recId } : {}),
           ...(talk && holdPref != null ? { hold_ms: holdPref } : {}) });
    if (holding && !rec) startAudio();
  };
  sock.onmessage = (m) => {
    if (ws === sock) lastRx = Date.now();
    try { onMessage(JSON.parse(m.data)); } catch {}
  };
  sock.onclose = (e) => {
    if (ws !== sock || mode !== "live") return;
    if (e.code === 4001) return finish("Open in another tab");
    streaming = false;
    failures++;
    if (failures >= 4) return checkStillLive();
    status("Reconnecting…", "amber");
    retryTimer = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 4, 5000);
  };
}

// A socket can die without closing (a network switch): no ping for a while
// means a new one. Also checked on recorder chunks, which hidden-page throttling doesn't slow.
function checkSocket() {
  if (mode !== "live" || !ws || ws.readyState !== 1 || Date.now() - lastRx < SOCKET_SILENT_MS) return;
  reconnectNow();
}

function reconnectNow() {
  const old = ws;
  backoff = 250;
  connect();
  try { old && old.close(); } catch {}
}
setInterval(checkSocket, 1000);

// A new network has probably killed the socket. `change` also fires on
// bandwidth estimates, so only a different kind of network counts.
addEventListener("online", () => { if (mode === "live") reconnectNow(); });
navigator.connection?.addEventListener?.("change", () => {
  const type = navigator.connection.type ?? null;
  if (type === netType) return;
  netType = type;
  if (mode === "live") reconnectNow();
});

// The relay has `have` of this run's chunks (-1: it lost the stream): resend the rest, or start afresh.
function resume(have) {
  if (!holding) return;
  const first = recKept.length ? recKept[0].i : recN;
  if (!rec || have < first || have > recN) return startAudio();
  for (const c of recKept) if (c.i >= have) ws.send(c.data);
  streaming = true;
  reportVis();
  if (!talk) return;
  // The voice track may have outlived the socket.
  if (voice && voice.connectionState === "connected" && voiceEl && !voiceEl.paused) send({ type: "voice_ready" });
  else startVoice();
}

// A refused socket and a dropped network look alike, so after a few failures
// ask whether the session still exists.
async function checkStillLive() {
  try {
    const r = await fetch(`/armed?k=${encodeURIComponent(K)}`, { cache: "no-store" });
    const ids = ((await r.json()).sessions || []).map((s) => s.id);
    if (!ids.includes(sid)) return finish("Session is over");
  } catch {}
  status("Reconnecting…", "amber");
  retryTimer = setTimeout(connect, backoff);
  backoff = Math.min(backoff * 2, 10000);
}

// One recorder run = one webm header = one transcriber stream on the server.
// Blobs are sent synchronously, so chunk order cannot race.
function segment() {
  stopRecorder();
  recId = Math.random().toString(36).slice(2, 10);
  recN = 0;
  recKept = [];
  send({ type: "seg", rec: recId });
  streaming = true;
  rec = new MediaRecorder(sendStream, { mimeType: MIME, audioBitsPerSecond: 64000 });
  rec.ondataavailable = (e) => {
    if (e.data.size) {
      recKept.push({ i: recN++, data: e.data });
      if (recKept.length > KEEP_CHUNKS) recKept.shift();
      if (streaming && ws && ws.readyState === 1) ws.send(e.data);
    }
    probeTick();
    checkSocket();
  };
  rec.onerror = () => status("Recorder error", "red");
  rec.start(250);
}

function stopRecorder() {
  if (!rec) return;
  rec.ondataavailable = null;   // its final chunk must not land in the next segment
  try { rec.stop(); } catch {}
  rec = null;
  recKept = [];
}

function onMessage(m) {
  if (m.type === "ping") return;
  if (m.type === "restart") segment();
  else if (m.type === "resume") resume(m.have);
  else if (m.type === "note") showNote(m.text, m.age_ms);
  else if (m.type === "ended") finish("Session ended");
  else if (m.type === "tts_start") { claudeTalking = true; if (voiceEl) voiceEl.muted = false; syncReference(); }
  // Muting drops what is still in flight, so the interruption is heard at once.
  else if (m.type === "tts_stop") { claudeTalking = false; if (voiceEl) voiceEl.muted = true; syncReference(); }
  else if (m.type === "tts_done") claudeTalking = false;
  else if (m.type === "voice_offer") answerVoice(m.sdp);
  else if (m.type === "voice_restart" && talk) startVoice();
  else if (m.type === "voice_failed") voiceFailed(m.error);
  else if (m.type === "settings") { holdMs = m.hold_ms; renderSheet(); }
  else if (m.type === "release") releaseAudio();
  else if (m.type === "call_failed") status(`Call failed: ${m.error}`, "red");
  else if (m.type === "room") {
    // Only a `release` takes the audio away: a room message sent before the
    // relay saw this screen's take would otherwise undo it.
    roomAudio = m.audio;
    roomCall = m.call || null;
    // The relay's clock, moved onto this page's, so the timer starts right on any device.
    roomSince = m.since == null ? null : m.since + (Date.now() - m.now);
    renderRoom();
    renderSheet();
  }
}

// ---- settings ----------------------------------------------------------------------
// The relay holds a session's values and sends them on every connect; this
// device remembers only what Louie last picked, to seed sessions that start here.

const HOLD_KEY = "intercom-hold";
const HOLD_STEPS = Array.from({ length: 21 }, (_, i) => i * 500);   // 0-10 s
let holdMs = null, holdPref = null;
try {
  const v = localStorage.getItem(HOLD_KEY);
  if (v !== null && HOLD_STEPS.includes(Number(v))) holdPref = Number(v);
} catch {}

function renderSheet() {
  $("holdrow").classList.toggle("hide", !talk);
  $("callme2").classList.toggle("hide", !!roomCall);
  $("hangup").classList.toggle("hide", !roomCall);
  $("usehere2").classList.toggle("hide", holding || !(roomAudio || roomCall));
  $("pip").classList.toggle("hide", !PIP_OK || !holding);
  const editing = editingNumber || !myNumber;
  $("numrow").innerHTML = myNumber && !editing ? `Calls ${myNumber} <button id="changenum">change</button>` : "Your number, for Call me";
  if ($("changenum")) $("changenum").onclick = () => { editingNumber = true; renderSheet(); };
  $("phonenum").classList.toggle("hide", !editing);
  $("savenum").classList.toggle("hide", !editing);
  if (holdMs == null) { $("holdval").textContent = "…"; return; }
  $("holdval").textContent = `${holdMs / 1000}s`;
  $("holddown").disabled = holdMs <= HOLD_STEPS[0];
  $("holdup").disabled = holdMs >= HOLD_STEPS[HOLD_STEPS.length - 1];
}

function stepHold(dir) {
  if (holdMs == null) return;
  const next = dir > 0 ? HOLD_STEPS.find((v) => v > holdMs) : [...HOLD_STEPS].reverse().find((v) => v < holdMs);
  if (next == null) return;
  holdMs = holdPref = next;
  try { localStorage.setItem(HOLD_KEY, String(next)); } catch {}
  send({ type: "set", hold_ms: next });
  renderSheet();
}

// The sheet takes a history entry, so the watch's back swipe closes it instead
// of leaving the page (and the room).
function openSheet() {
  renderSheet();
  $("sheet").classList.remove("hide");
  history.pushState({ sheet: true }, "");
}

function closeSheet() {
  if ($("sheet").classList.contains("hide")) return;
  $("sheet").classList.add("hide");
  editingNumber = false;
  if (history.state?.sheet) history.back();
}

addEventListener("popstate", () => {
  if (!$("sheet").classList.contains("hide")) { $("sheet").classList.add("hide"); editingNumber = false; }
});

// ---- the phone line ------------------------------------------------------------------
// The relay keeps no number: this device remembers Louie's and sends it with
// each Call me.

const PHONE_KEY = "intercom-phone";
let myNumber = "", editingNumber = false;
try { myNumber = localStorage.getItem(PHONE_KEY) || ""; } catch {}

// Accepts what people type: "+1 (415) 555-0123", or ten US digits.
function e164(text) {
  const digits = text.replace(/[^\d]/g, "");
  const n = text.trim().startsWith("+") ? `+${digits}` : digits.length === 10 ? `+1${digits}` : `+${digits}`;
  return /^\+[1-9]\d{6,14}$/.test(n) ? n : null;
}

function callMe() {
  if (!myNumber) {
    editingNumber = true;
    if ($("sheet").classList.contains("hide")) openSheet();
    else renderSheet();
    return $("phonenum").focus();
  }
  closeSheet();
  status("");
  send({ type: "call", to: myNumber });
}

$("savenum").onclick = () => {
  const n = e164($("phonenum").value);
  if (!n) { $("numrow").textContent = "That doesn't look like a phone number"; return; }
  myNumber = n;
  try { localStorage.setItem(PHONE_KEY, n); } catch {}
  editingNumber = false;
  renderSheet();
};
$("callme").onclick = callMe;
$("callme2").onclick = callMe;
$("hangup").onclick = () => { closeSheet(); send({ type: "hangup" }); };
setInterval(() => { if (mode === "live" && roomSince != null) renderRoom(); }, 1000);

$("menu").onclick = openSheet;
$("done").onclick = closeSheet;
$("usehere").onclick = takeAudio;
$("usehere2").onclick = takeAudio;
$("holddown").onclick = () => stepHold(-1);
$("holdup").onclick = () => stepHold(1);

// ---- Claude's voice (talk mode) ------------------------------------------------------
// A WebRTC track from Cloudflare's SFU, played by an <audio> element: the only
// playback Chrome on Android cancels from the mic. The relay paces it and keeps
// time; the page just mutes it the moment Louie cuts in.

// Measured on the watch: echo residue comes in bursts of a few loud frames;
// Louie's speech holds 70-100% of frames above -35 dB. A one-second window let
// echo bursts through, so the gate wants most of two seconds: an interruption
// takes real talking.
const GATE_FLOOR_DB = -35;
// AEC3's raw mic reads ~10 dB lower. Its echo crossed -42 dB in one lone frame
// in ~28 s of Claude talking, so the gate can open in half a second, inside the
// relay's lookback: an interruption keeps its first words.
const AEC_GATE_FLOOR_DB = -42;
const AEC_GATE_WINDOW = 5;
const AEC_GATE_MIN_FRAMES = 3;
// Running water by the watch reads as loud as Louie; WebRTC's VAD called 1-2% of
// it voice, and 58-72% of his speech over it.
const AEC_VOICE_MIN = 0.2;
const GATE_WINDOW = 20;
const GATE_MIN_FRAMES = 12;
const JITTER_MS = 500;   // smoothness over latency: Claude doesn't need call-grade timing
// Like claude.ai's voice mode: a moment of Louie's voice turns Claude down, here
// on the device, so he can be heard while the gate decides whether he is interrupting.
const DUCK_FRAMES = 2;
const UNDUCK_FRAMES = 10;
const DUCK_VOLUME = 0.25;

function voiceFailed(why) { status(`No voice: ${why}`, "red"); }

// AEC3 (../aec) on the raw mic against Claude's voice; its output becomes
// sendStream. The processed mic stays open, unsent, to keep Android in call
// mode. Any failure leaves the browser's echo cancellation in place.
async function startAec() {
  try {
    const [module] = await Promise.all([
      WebAssembly.compileStreaming(fetch("/aec/aec3.wasm")),
      meterCtx.audioWorklet.addModule("/aec/worklet.js"),
    ]);
    raw = await navigator.mediaDevices.getUserMedia({ audio:
      { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const into = meterCtx.createChannelMerger(2);
    meterCtx.createMediaStreamSource(raw).connect(into, 0, 0);
    const gain = meterCtx.createGain();
    gain.connect(into, 0, 1);
    const node = new AudioWorkletNode(meterCtx, "aec3", { numberOfInputs: 1, numberOfOutputs: 1,
      outputChannelCount: [1], channelCount: 2, channelCountMode: "explicit",
      channelInterpretation: "discrete", processorOptions: { module } });
    into.connect(node);
    const dest = meterCtx.createMediaStreamDestination();
    node.connect(dest);
    sendStream.getTracks().forEach((t) => t.stop());
    sendStream = dest.stream;
    aec = { gain, source: null, voice: null };
    node.port.onmessage = (e) => { if (aec) aec.voice = e.data; };
    aecReference();
  } catch (e) {
    console.warn("own echo cancellation unavailable", e);
    if (raw) raw.getTracks().forEach((t) => t.stop());
    raw = aec = null;
  }
}

// Claude's track into AEC3, again whenever the voice reconnects.
function aecReference() {
  if (!aec || !voiceEl || !voiceEl.srcObject) return;
  try { aec.source && aec.source.disconnect(); } catch {}
  aec.source = meterCtx.createMediaStreamSource(voiceEl.srcObject);
  aec.source.connect(aec.gain);
  syncReference();
}

// The reference must be what the speaker plays: ducked, or silent when muted.
function syncReference() {
  if (aec && voiceEl) aec.gain.gain.value = voiceEl.muted ? 0 : voiceEl.volume;
}

// The mic's level after echo cancellation, every 100 ms, drives the echo gate:
// sustained energy, not a spike. Only transitions are sent.
function startMeter() {
  if (!meterCtx || !sendStream) return;
  const [floor, gateWindow, gateMin] = aec ? [AEC_GATE_FLOOR_DB, AEC_GATE_WINDOW, AEC_GATE_MIN_FRAMES]
    : [GATE_FLOOR_DB, GATE_WINDOW, GATE_MIN_FRAMES];
  const an = meterCtx.createAnalyser();
  an.fftSize = 2048;
  // The muted clone: talking to someone else while muted must not interrupt Claude.
  meterCtx.createMediaStreamSource(sendStream).connect(an);
  const buf = new Float32Array(an.fftSize);
  let recent = [], loud = false, hotRun = 0, quietRun = 0;
  clearInterval(meterTimer);
  meterTimer = setInterval(() => {
    an.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9);
    // No VAD reading (AEC3 paused or just starting) counts as no voice.
    const hot = db > floor && (!aec || (aec.voice ?? 0) >= AEC_VOICE_MIN);
    recent.push(hot);
    if (recent.length > gateWindow) recent.shift();
    const now = recent.filter(Boolean).length >= gateMin;
    if (now !== loud) { loud = now; send({ type: "loud", on: loud }); }
    hotRun = hot ? hotRun + 1 : 0;
    quietRun = hot ? 0 : quietRun + 1;
    if (!voiceEl) return;
    if (!claudeTalking || quietRun >= UNDUCK_FRAMES) voiceEl.volume = 1;
    else if (hotRun >= DUCK_FRAMES) voiceEl.volume = DUCK_VOLUME;
    syncReference();
  }, 100);
}

// Whether the mic really hears anything, which leaving the screen no longer
// settles: Chrome with AndroidEnableBackgroundMediaCapturing keeps it, without
// it Android feeds exact zeros, and a real room is never exactly zero. A frozen
// buffer means the context stopped, so the page can't tell.
const PROBE_MS = 500;
const SILENT_MS = 3000;
const PROBE_REPEAT_MS = 5000;   // so the relay can tell a stale reading
function startProbe() {
  probe = null;
  if (!meterCtx || !stream) return;
  const an = meterCtx.createAnalyser();
  an.fftSize = 2048;
  meterCtx.createMediaStreamSource(stream).connect(an);
  probe = { an, buf: new Float32Array(an.fftSize), prev: null, zeroSince: null, at: 0, sent: null, sentAt: 0 };
}

// Driven by recorder chunks, not a timer: Chrome throttles a hidden page's timers
// to once a minute, but chunks keep coming as long as the recorder runs.
function probeTick() {
  scheduleChirps();
  const p = probe, now = Date.now();
  if (!p || now - p.at < PROBE_MS) return;
  p.at = now;
  p.an.getFloatTimeDomainData(p.buf);
  const zero = p.buf.every((v) => v === 0);
  const frozen = !zero && p.prev && p.buf.every((v, i) => v === p.prev[i]);
  p.prev = p.buf.slice();
  p.zeroSince = zero ? (p.zeroSince ?? now) : null;
  const state = meterCtx.state !== "running" || frozen ? "unknown"
    : !zero ? "live" : now - p.zeroSince >= SILENT_MS ? "silent" : p.sent;
  if (state && (state !== p.sent || now - p.sentAt >= PROBE_REPEAT_MS)) {
    p.sent = state; p.sentAt = now;
    send({ type: "mic", state });
  }
}

// Chrome freezes a hidden page 90s after it last made a sound (Blink's
// StopInBackground), mic or not; sound is the only exemption. So the page chirps
// 19 kHz at -49 dBFS (audible to Chrome above -72, not to Louie) for a second
// every 20s, scheduled ahead on the audio clock, which throttling doesn't touch.
const CHIRP_HZ = 19000;
const CHIRP_GAIN = 0.005;
const CHIRP_EVERY_S = 20;
const CHIRP_S = 1;
const CHIRP_RAMP_S = 0.05;      // a hard edge would click across the whole spectrum
const CHIRP_AHEAD_S = 3600;
function startChirps() {
  chirp = null;
  if (!meterCtx) return;
  const osc = meterCtx.createOscillator();
  osc.frequency.value = CHIRP_HZ;
  const gain = meterCtx.createGain();
  gain.gain.value = 0;
  osc.connect(gain).connect(meterCtx.destination);
  osc.start();
  chirp = { gain, until: 0 };
  scheduleChirps();
}

function scheduleChirps() {
  const c = chirp;
  if (!c) return;
  const now = meterCtx.currentTime;
  if (c.until - now > CHIRP_AHEAD_S / 2) return;
  const g = c.gain.gain;
  let t = Math.max(c.until, now + 0.1);
  for (; t < now + CHIRP_AHEAD_S; t += CHIRP_EVERY_S) {
    g.setValueAtTime(0, t);
    g.linearRampToValueAtTime(CHIRP_GAIN, t + CHIRP_RAMP_S);
    g.setValueAtTime(CHIRP_GAIN, t + CHIRP_S - CHIRP_RAMP_S);
    g.linearRampToValueAtTime(0, t + CHIRP_S);
  }
  c.until = t;
}

function closeVoice() {
  try { voice && voice.close(); } catch {}
  voice = null;
}

function startVoice() {
  closeVoice();
  const pc = voice = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }] });
  // The relay holds Claude's speech until both are true: anything sent earlier is never heard.
  let playing = false;
  const ready = () => { if (voice === pc && playing && pc.connectionState === "connected") send({ type: "voice_ready" }); };
  pc.ontrack = (e) => {
    try { e.receiver.jitterBufferTarget = JITTER_MS; } catch {}
    voiceEl.srcObject = new MediaStream([e.track]);
    aecReference();
    voiceEl.play().then(() => { playing = true; ready(); }, (err) => voiceFailed(`won't play (${err.name})`));
  };
  // A network switch fails the voice's connection too: ask for the track again, a few times.
  pc.onconnectionstatechange = () => {
    if (voice === pc && pc.connectionState === "connected") voiceRetries = 0;
    if (voice === pc && pc.connectionState === "failed") {
      if (holding && voiceRetries++ < 3) startVoice();
      else voiceFailed("connection failed");
    }
    ready();
  };
  send({ type: "voice_request" });
}

async function answerVoice(sdp) {
  const pc = voice;
  if (!pc) return;
  try {
    await pc.setRemoteDescription(sdp);
    await pc.setLocalDescription(await pc.createAnswer());
    // Answer with candidates included; bounded, as gathering can stall on some networks.
    await new Promise((res) => {
      if (pc.iceGatheringState === "complete") return res();
      const t = setTimeout(res, 2000);
      pc.addEventListener("icegatheringstatechange", () => {
        if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); }
      });
    });
    if (voice === pc) send({ type: "voice_answer", sdp: pc.localDescription });
  } catch (err) {
    voiceFailed(err.name);
  }
}

// A long steer shrinks until it fits between the audio line and stop, beside
// any status; past the smallest size, the middle scrolls.
function fitNote(n) {
  let room = $("stage").clientHeight * 0.28;   // #live's max-height
  for (const id of ["status"]) {
    const el = $(id);
    if (!el.classList.contains("hide")) room -= el.offsetHeight + $("stage").clientHeight * 0.04;
  }
  let size = 6.5;
  n.style.fontSize = size + "vmin";
  while (n.scrollHeight > room && size > 4) {
    size -= 0.5;
    n.style.fontSize = size + "vmin";
  }
}

// A steer stays until the next replaces it, dimmed once stale.
const NOTE_FRESH_MS = 30000;
// `ageMs` marks a note sent before this screen joined: shown quietly, with
// whatever freshness it has left.
function showNote(text, ageMs) {
  const n = $("note");
  n.textContent = text;
  fitNote(n);
  n.classList.remove("flash", "old");
  clearTimeout(noteTimer);
  const fresh = NOTE_FRESH_MS - (ageMs ?? 0);
  if (fresh <= 0) return n.classList.add("old");
  if (ageMs == null) {
    try { navigator.vibrate && navigator.vibrate([80, 60, 80]); } catch {}
    void n.offsetWidth; n.classList.add("flash");
  }
  noteTimer = setTimeout(() => { n.classList.remove("flash"); n.classList.add("old"); }, fresh);
}

// Mic, recorder and Claude's voice off: nothing of the room's audio stays on
// this device (Android's mic dot goes out). The screen stays in the room.
function releaseAudio() {
  holding = false;
  closeVoice();
  claudeTalking = false;
  if (voiceEl) voiceEl.muted = true;
  clearInterval(meterTimer);
  probe = null;
  chirp = null;
  try { meterCtx && meterCtx.close(); } catch {}
  meterCtx = null;
  closePip();
  stopRecorder();
  for (const s of [stream, sendStream, raw]) if (s) s.getTracks().forEach((t) => t.stop());
  stream = sendStream = raw = aec = null;
  renderRoom();
  renderSheet();
}

// Audio and socket off; the mode is set first, so the close isn't retried.
function release() {
  clearTimeout(retryTimer);
  releaseAudio();
  const sock = ws; ws = null;
  try { sock && sock.close(1000); } catch {}
  try { lock && lock.release(); } catch {}
  lock = null;
}

function finish(why) {
  mode = "idle";
  release();
  show("idle");
  $("list").innerHTML = "";
  $("msg").classList.remove("hide");
  $("msg").textContent = why;
  setTimeout(() => { if (mode === "idle") poll(); }, 4000);
}

// Flush the recorder first: its last chunk carries the final words.
async function flushRecorder() {
  const r = rec;
  rec = null;
  if (r) await new Promise((res) => { r.onstop = res; try { r.stop(); } catch { res(); } });
}

$("stop").onclick = async () => {
  await flushRecorder();
  send({ type: "stop" });
  setTimeout(() => finish("Stopped"), 300);
};

// Leaving audio keeps this screen in the room; the choice comes back.
$("pause").onclick = async () => {
  if (!holding) return;
  if (voiceEl) voiceEl.muted = true;
  await flushRecorder();
  send({ type: "leave" });
  releaseAudio();
};

// Mic off, everything else on: Claude still talks and works. A pause keeps it.
function applyMute() {
  if (sendStream) sendStream.getAudioTracks()[0].enabled = !muted;
  $("mute").classList.toggle("on", muted);
  $("mute").setAttribute("aria-label", muted ? "unmute" : "mute");
}
$("mute").onclick = () => { muted = !muted; applyMute(); };

// ---- picture-in-picture (phones) ---------------------------------------------------
// Chrome on Android silences a background page's mic after ~5s, unless the page
// has a picture-in-picture window open. Closing that window while away silences
// it again, so the page then counts as hidden (crbug 491996749).

let pipVideo = null;

function pipTile() {
  if (pipVideo) return pipVideo;
  const c = document.createElement("canvas");
  c.width = c.height = 160;
  const g = c.getContext("2d");
  const icon = new Image();
  icon.src = document.querySelector('link[rel="icon"]').href;
  const draw = () => {
    // Tucked against the screen edge, ~17% of one side shows: orange that far
    // in stands out on dark and light apps alike.
    g.fillStyle = "#d97757";
    g.fillRect(0, 0, 160, 160);
    g.fillStyle = "#f0eee6";
    g.beginPath(); g.roundRect(40, 14, 80, 80, 16); g.fill();
    if (icon.complete) g.drawImage(icon, 44, 18, 72, 72);
    g.fillStyle = "#fff";
    g.font = "600 30px system-ui, sans-serif";
    g.textAlign = "center";
    g.fillText(sid || "", 80, 146);
  };
  draw();
  setInterval(draw, 1000);
  pipVideo = document.createElement("video");
  pipVideo.muted = true;
  pipVideo.playsInline = true;
  pipVideo.srcObject = c.captureStream(1);
  pipVideo.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;pointer-events:none";
  document.body.appendChild(pipVideo);
  for (const e of ["enterpictureinpicture", "leavepictureinpicture"]) {
    pipVideo.addEventListener(e, () => { if (mode === "live") reportVis(); });
  }
  return pipVideo;
}

async function openPip() {
  if (!PIP_OK) return;
  const v = pipTile();
  try { await v.play(); await v.requestPictureInPicture(); } catch {}
}

function closePip() {
  if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
}

// A page in picture-in-picture keeps its mic, so it reports as visible. Only the
// screen holding the audio has a mic to report on.
function reportVis() {
  if (holding) send({ type: "vis", state: document.pictureInPictureElement ? "visible" : document.visibilityState });
}

// The tile takes the screen over at once, so the sheet goes first.
$("pip").onclick = () => { closeSheet(); openPip(); };

document.addEventListener("visibilitychange", () => {
  if (mode !== "live") { if (document.visibilityState === "visible") poll(); return; }
  reportVis();
  if (document.visibilityState === "visible") {
    wake();
    if (!ws || ws.readyState > 1) { backoff = 250; connect(); }
  }
});

// ?debug: the viewport this browser reports, for fitting a new device.
if (new URLSearchParams(location.search).has("debug")) {
  const d = $("debug");
  d.classList.remove("hide");
  const report = () => {
    const vv = window.visualViewport;
    d.textContent = `inner ${innerWidth}x${innerHeight} screen ${screen.width}x${screen.height}\n` +
      `dpr ${devicePixelRatio} vv ${vv ? `${Math.round(vv.width)}x${Math.round(vv.height)}@${vv.scale}` : "-"} ui ${UI}`;
  };
  report(); addEventListener("resize", report);
}

// The watch's browser opens a new tab on every bookmark tap and has no tab
// switcher, so a new copy tells older ones to close. A bookmark-opened tab has
// one history entry, which lets it close itself.
let others = null;
try {
  others = new BroadcastChannel("intercom-page");
  others.onmessage = (e) => { if (e.data === "opened" && mode !== "live") window.close(); };
  others.postMessage("opened");
} catch {}

if (K) { show("idle"); poll(); } else needPairing();
</script>
</body></html>
