name = "claude-intercom"
main = "worker.js"
compatibility_date = "2026-01-01"

# Overridable so tests can point the relay at local fakes. Workers open an
# outbound websocket with fetch(), so the live URL is https://, not wss://.
[vars]
SONIOX_URL = "https://stt-rt.soniox.com/transcribe-websocket"
SONIOX_TTS_URL = "https://tts-rt.soniox.com/tts-websocket"
SFU_URL = "https://rtc.live.cloudflare.com/v1/apps"
DEEPGRAM_URL = "https://api.deepgram.com/v1/listen"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session", "Registry"]
