<!doctype html>
<meta charset="utf-8">
<title>Retell dialer — web call</title>
<!--
  Testing affordance, not the production path: a real call goes out over PSTN
  via `dialer dispatch --to` and needs no browser. This exists so the loop
  can be exercised without a phone number on the account — the brief is written
  exactly as it would be for a real call, and you pick up instead of a
  receptionist. Served over http://localhost because getUserMedia needs a secure
  context and file:// is not one.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 0 auto;
         padding: 1.5rem 1rem; }
  h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
  .sub { opacity: .65; margin: 0 0 1.25rem; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
         margin-bottom: 1rem; }
  input { flex: 1 1 18rem; min-width: 0; padding: .5rem; font: inherit;
          font-family: ui-monospace, monospace; }
  button { padding: .5rem 1rem; font: inherit; cursor: pointer; }
  #status { font-family: ui-monospace, monospace; padding: .5rem .75rem;
            border-left: 3px solid currentColor; opacity: .8; margin-bottom: 1rem; }
  #transcript { display: flex; flex-direction: column; gap: .5rem; }
  .turn { padding: .5rem .75rem; border-radius: .4rem; max-width: 85%;
          white-space: pre-wrap; overflow-wrap: anywhere; }
  .agent { background: color-mix(in oklab, currentColor 10%, transparent);
           align-self: flex-start; }
  .user  { background: color-mix(in oklab, currentColor 18%, transparent);
           align-self: flex-end; }
  .who { display: block; font-size: .75rem; opacity: .6; }
</style>

<h1>Retell dialer — web call</h1>
<p class="sub">You are the person being called. Ask it something its brief does
not cover and watch the consult fire.</p>

<div class="bar">
  <button id="start">Join call</button>
  <button id="stop" disabled>Hang up</button>
</div>

<div id="status">idle</div>
<div id="transcript"></div>

<script src="retell-sdk.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const setStatus = t => { $("status").textContent = t; };
  const renderTurns = turns => {
    if (!Array.isArray(turns)) return;
    // The SDK re-sends the whole transcript each time rather than a delta, so
    // redraw instead of appending.
    $("transcript").replaceChildren(...turns.map(t => {
      const el = document.createElement("div");
      el.className = "turn " + (t.role === "agent" ? "agent" : "user");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = t.role === "agent" ? "agent" : "you";
      el.append(who, t.content ?? "");
      return el;
    }));
    window.scrollTo(0, document.body.scrollHeight);
  };

  // The call is created by this click, not handed over in advance. A
  // registered web call expires in about a minute, so a token minted when the
  // message was written has usually gone stale by the time anyone clicks it --
  // which reads as "the button does nothing".
  let client = null;

  const wire = c => {
    c.on("status", s => {
      setStatus(s);
      const live = s === "live" || s === "connecting";
      $("start").disabled = live;
      $("stop").disabled = !live;
    });
    c.on("transcript", renderTurns);
    c.on("update", e => renderTurns(e?.transcript));
    c.on("end", () => setStatus("call ended"));
    c.on("error", e => setStatus("error: " + (e?.message || e)));
  };

  $("start").onclick = async () => {
    $("start").disabled = true;
    setStatus("dialling…");
    try {
      const r = await fetch("/dispatch", { method: "POST" });
      const body = await r.json();
      if (!r.ok) throw new Error(body.error || ("dispatch failed: " + r.status));
      setStatus("connecting… " + body.call_id);
      if (!client) { client = new Retell.RetellWebClient(); wire(client); }
      await client.startCall({ accessToken: body.access_token });
      // Autoplay policy blocks the agent's audio unless playback resumes from
      // inside a user gesture, which this click still is.
      await client.startAudioPlayback?.();
      $("stop").disabled = false;
    } catch (e) {
      console.error(e);
      setStatus("failed: " + (e?.message || e));
      $("start").disabled = false;
    }
  };

  $("stop").onclick = () => { client?.stopCall(); setStatus("call ended"); };

  window.addEventListener("error", e => setStatus("page error: " + e.message));
  setStatus(window.Retell ? "idle -- SDK loaded" : "SDK FAILED TO LOAD");
</script>
